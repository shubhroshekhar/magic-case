name: JavaScript tests

on:
  push:
    branches: [ "**" ]
    paths:
      - "js/**"
      - ".github/workflows/js-tests.yml"
  pull_request:
    paths:
      - "js/**"
      - ".github/workflows/js-tests.yml"

permissions:
  contents: read

concurrency:
  group: js-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "21"]
        task: ["test", "lint", "build"]
    defaults:
      run:
        working-directory: js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        if: matrix.task == 'test'
        run: npm test

      - name: Run linting
        if: matrix.task == 'lint'
        run: npm run lint

      - name: Run formatting check
        if: matrix.task == 'lint'
        run: npx prettier --check .

      - name: Build package
        if: matrix.task == 'build'
        run: npm run build

      - name: Test CLI
        if: matrix.task == 'test'
        run: |
          node cli.js --help
          node cli.js camel "hello world"
          node cli.js snake "camelCase"
          node cli.js kebab "PascalCase"

  release:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/prod'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        working-directory: js
        run: npm ci

      - name: Get version from package.json
        working-directory: js
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag already exists
        if: steps.check_tag.outputs.tag_exists == 'true'
        run: echo "Tag v${{ steps.version.outputs.version }} already exists, skipping tag creation"
